# ============================================================================
# dsh-diary-maid —— DSH bundle patch
# ============================================================================
# 安装后向 profile 注入一行宿主插件；面板由 dsh.client 声明单独加载。
#
#   vaultPath：日记本根目录。默认 ~/dsh-diary；本机指向工作区下的 vault/。
#              目录不存在时插件会自动创建（含 git init）。
# ============================================================================

- insert:
    - id: dsh-diary-maid
      name: dsh-diary-maid
      config:
        vaultPath: /sdcard/dsh日记/vault
        git: true
        dayCutoffHour: 4
        timeZone: Asia/Shanghai
